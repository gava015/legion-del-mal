name: Comunicador de la legión

on:
  workflow_dispatch:
    inputs:
      villano:
        descripcion: '¿Qué villano envía el mensaje?'
        required: true
        type: choice
        options:
          - Lex Luthor
          - Magneto
          - Joker
          - Mystique
          - Brainiac
      mensaje: 
          description: 'Mensaje para el consejo'
          required: true
          default: 'La misión fue un éxito'

      prioridad:
        descripcion: 'Nivel de prioridad'
        required: true
        type: choice
        options:
          - Normal
          - Alta
          - Crítica
         

jobs:
  transmitir-mensaje:
      runs-on: ubuntu-latest

      steps:
       - uses: actions/checkout@v4

    