# =============================================
# FICHA DE VILLANO - LEGIÓN DEL MAL
# =============================================

nombre: "Trigon"
universo: DC
rango: "Villano demonio"
estado: activo


habilidades:
 
- Magia demoníaca	Puede utilizar magia extremadamente poderosa para atacar, defenderse y alterar su entorno.
- Manipulación de la realidad	Puede modificar las leyes de la realidad y transformar mundos.
- Manipulación dimensional	Puede viajar entre dimensiones y abrir portales.
- Telepatía	Puede leer mentes, comunicarse mentalmente y manipular la voluntad de otros.
- Telequinesis	Puede mover objetos y seres vivos con su mente.


ubicacion:

- Dimensión de origen, una dimensión demoníaca que suele llamarse el reino de Trigon

- Ubicación habitual, su propio reino, desde donde gobierna y conquista otras dimensiones.
 


